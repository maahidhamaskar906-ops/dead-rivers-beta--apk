name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev cmake libffi-dev
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Dead Rivers/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = deadrivers/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,hostpython3/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: DeadRivers-APK
        path: bin/*.apk
        
